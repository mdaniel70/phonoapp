<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teachers:wght@400;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Teachers', sans-serif; }</style>
</head>
<body class="bg-slate-100 p-8">

    <div class="max-w-md mx-auto bg-white rounded-3xl p-8 shadow-xl text-center border-2 border-slate-200">
        <h1 class="text-3xl font-black text-slate-900 mb-6 uppercase tracking-tight">Phonogram Lab</h1>
        
        <div class="w-full h-48 bg-purple-50 rounded-2xl flex items-center justify-center mb-8 border-2 border-dashed border-purple-200">
            <span class="text-7xl font-black text-purple-600">sh</span>
        </div>

        <div class="space-y-4">
            <button id="record-btn" class="w-full bg-purple-600 text-white py-4 rounded-full font-black text-xl uppercase hover:bg-purple-700 transition-all flex items-center justify-center gap-2">
                <div id="mic-icon" class="w-3 h-3 bg-white rounded-full"></div>
                Start Recording
            </button>

            <p id="status" class="text-slate-500 font-bold">Press the button and say the sound.</p>

            <div id="playback-container" class="hidden pt-4 border-t border-slate-100">
                <p class="text-sm text-slate-400 mb-2 uppercase font-bold">Your Recording:</p>
                <audio id="audio-playback" controls class="w-full"></audio>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        const recordBtn = document.getElementById('record-btn');
        const micIcon = document.getElementById('mic-icon');
        const statusText = document.getElementById('status');
        const playbackContainer = document.getElementById('playback-container');
        const audioPlayback = document.getElementById('audio-playback');

        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                // START RECORDING
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    audioPlayback.src = audioUrl;
                    playbackContainer.classList.remove('hidden');
                };

                mediaRecorder.start();
                recordBtn.innerText = "Stop Recording";
                recordBtn.classList.replace('bg-purple-600', 'bg-red-500');
                micIcon.classList.add('animate-pulse');
                statusText.innerText = "Listening to your sound...";
            } else {
                // STOP RECORDING
                mediaRecorder.stop();
                recordBtn.innerText = "Start Recording";
                recordBtn.classList.replace('bg-red-500', 'bg-purple-600');
                micIcon.classList.remove('animate-pulse');
                statusText.innerText = "Recording saved! Listen below.";
            }
        });
    </script>
</body>
</html>
