<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonogram Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sticker { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .perspective-1000 { perspective: 1000px; }
    </style>
</head>
<body class="bg-blue-50 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold text-purple-800">Phonogram Lab</h1>
        <div id="sticker-count" class="bg-white px-4 py-2 rounded-full shadow-sm font-bold text-purple-600">
            ⭐ 0
        </div>
    </div>

    <div class="relative w-80 h-96 perspective-1000">
        <div id="card" class="w-full h-full bg-white rounded-3xl shadow-xl flex flex-col items-center justify-center p-8 text-center">
            
            <div id="visualizer-container" style="width: 100%; height: 50px; display: flex; align-items: center; justify-content: center; gap: 3px; margin-bottom: 20px;"></div>

            <div id="card-content" class="flex-grow flex items-center justify-center">
                <h2 id="card-letters" class="text-8xl font-bold text-gray-800">...</h2>
                <div id="card-loader" class="hidden">
                    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-purple-600"></div>
                </div>
            </div>

            <p id="status-msg" class="mt-4 text-gray-500 font-medium uppercase tracking-widest text-sm">Initialising...</p>
        </div>
    </div>

    <div class="mt-12 flex flex-col items-center gap-4">
        <button id="main-btn" class="bg-purple-600 hover:bg-purple-700 text-white text-xl font-bold py-6 px-12 rounded-2xl shadow-lg transform transition active:scale-95">
            PUSH TO SPEAK
        </button>
    </div>

    <div id="debug-log" class="mt-8 p-4 bg-gray-800 text-green-400 font-mono text-xs rounded-lg w-full max-w-md overflow-hidden" style="display: block;">
        DEBUG: Waiting for first recording...
    </div>

    <div id="sticker-shelf" class="mt-12 flex flex-wrap justify-center gap-2 max-w-md"></div>

    <audio id="teacher-audio"></audio>

    <script>
       // --- CONFIGURATION ---
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwaS3Hx1WYlrkM3E0rjcwcCfJx4RZSx0urgMVMNXXdonAZxQTPxqIs3V9L9Nxza1nGL/exec"; 
        
        const phonograms = [
            { letters: "sh", sounds: ["sh"] },
            { letters: "ch", sounds: ["ch", "k", "sh"] },
            { letters: "ir", sounds: ["er"] },
            { letters: "th", sounds: ["th"] }
        ];

        let currentIndex = 0;
        let stickers = 0;
        let attempts = 0;
        let mediaRecorder = null;
        let audioChunks = [];
        let audioContext, analyser, dataArray, animationId;
        let isCoolingDown = false; 
        
        const mainBtn = document.getElementById('main-btn');
        const statusMsg = document.getElementById('status-msg');
        const cardLetters = document.getElementById('card-letters');
        const cardLoader = document.getElementById('card-loader');

        // Initial Load - This puts the first letters on the card
        window.addEventListener('load', () => {
            console.log("Page loaded. Initializing card...");
            updateCard();
            statusMsg.innerText = "Ready for your sounds";
        });

        function updateCard() {
            if (phonograms[currentIndex]) {
                cardLetters.innerText = phonograms[currentIndex].letters;
                cardLetters.style.display = 'block';
                cardLoader.style.display = 'none';
                console.log("Card updated to:", phonograms[currentIndex].letters);
            } else {
                console.error("Error: Phonogram at index " + currentIndex + " not found.");
            }
        }

        mainBtn.addEventListener('click', async () => {
            if (isCoolingDown) return;

            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const options = { mimeType: 'audio/webm;codecs=opus' };
                    mediaRecorder = new MediaRecorder(stream, options);

                    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioContext.state === 'suspended') await audioContext.resume();
                    
                    const source = audioContext.createMediaStreamSource(stream);
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 32;
                    source.connect(analyser);
                    
                    const bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);
                    const container = document.getElementById('visualizer-container');
                    container.innerHTML = ''; 
                    for (let i = 0; i < bufferLength; i++) {
                        const bar = document.createElement('div');
                        bar.style.width = '8px';
                        bar.style.backgroundColor = '#9333ea';
                        bar.style.borderRadius = '4px';
                        container.appendChild(bar);
                    }

                    function draw() {
                        animationId = requestAnimationFrame(draw);
                        analyser.getByteFrequencyData(dataArray);
                        const bars = container.querySelectorAll('div');
                        dataArray.forEach((value, i) => {
                            const height = (value / 255) * 50;
                            if(bars[i]) bars[i].style.height = `${Math.max(4, height)}px`;
                        });
                    }
                    draw();

                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        cancelAnimationFrame(animationId);
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        if (audioBlob.size < 500) {
                            statusMsg.innerText = "Too quiet! Try again.";
                            resetButton(true);
                            return;
                        }
                        processAudio(audioBlob);
                    };

                    mediaRecorder.start();
                    mainBtn.innerText = "STOP";
                    mainBtn.classList.replace('bg-purple-600', 'bg-red-500');
                    statusMsg.innerText = "Listening...";

                } catch (err) {
                    console.error("Mic Access Error:", err);
                    statusMsg.innerText = "Mic access denied";
                }
            } else {
                mediaRecorder.stop();
                isCoolingDown = true;
                mainBtn.innerText = "PROCESSING...";
                mainBtn.classList.replace('bg-red-500', 'bg-gray-400');
            }
        });

        async function processAudio(blob) {
            cardLetters.style.display = 'none';
            cardLoader.style.display = 'block';

            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async () => {
                const base64Audio = reader.result.split(',')[1];
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            phonogram: phonograms[currentIndex].letters,
                            audio: base64Audio
                        }),
                        redirect: "follow"
                    });
                    const rawResult = await response.text();
                    const parts = rawResult.split('|');
                    const verdict = parts[0].trim().toUpperCase();
                    const reason = parts[1] ? parts[1].trim() : "No reason provided";

                    document.getElementById('debug-log').innerText = `AI HEARD: ${reason}`;
                    handleVerdict(verdict === "CORRECT");
                } catch (e) {
                    statusMsg.innerText = "Connection Error";
                    resetButton();
                }
            };
        }

        function handleVerdict(isCorrect) {
            if (isCorrect) {
                statusMsg.innerText = "CORRECT!";
                playDing();
                addSticker();
                attempts = 0;
                setTimeout(moveToNextCard, 2000);
            } else {
                attempts++;
                if (attempts >= 2) {
                    statusMsg.innerText = "Let's move on!";
                    playTeacherAudio();
                    attempts = 0; 
                    setTimeout(moveToNextCard, 4000);
                } else {
                    statusMsg.innerText = "Try one more time!";
                    playTeacherAudio();
                    setTimeout(() => {
                        updateCard();
                        resetButton();
                    }, 3000);
                }
            }
        }

        function playTeacherAudio() {
            const audio = document.getElementById('teacher-audio');
            audio.src = `audio/${phonograms[currentIndex].letters}.mp3`;
            audio.play().catch(() => console.log("Audio missing"));
        }

        function moveToNextCard() {
            currentIndex = (currentIndex + 1) % phonograms.length;
            updateCard();
            statusMsg.innerText = "Ready!";
            resetButton();
        }

        function resetButton(immediate = false) {
            setTimeout(() => {
                isCoolingDown = false; 
                mainBtn.innerText = "PUSH TO SPEAK";
                mainBtn.classList.remove('bg-yellow-500', 'bg-red-500', 'bg-gray-400');
                mainBtn.classList.add('bg-purple-600');
            }, immediate ? 0 : 3000);
        }

        function playDing() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.value = 880;
            g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
            osc.start(); osc.stop(ctx.currentTime + 0.5);
        }

        function addSticker() {
            stickers++;
            document.getElementById('sticker-count').innerText = `⭐ ${stickers}`;
            const s = document.createElement('div');
            s.className = "text-3xl sticker";
            s.innerText = "🍦"; 
            document.getElementById('sticker-shelf').appendChild(s);
        }
        </script>
</body>
</html>
