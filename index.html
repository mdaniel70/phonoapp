        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

            // 1. Show saved High Score
            document.getElementById('high-score-display').innerText = `🏆 Best: ${highScore}%`;
            
            // 2. Shuffle and prepare session
            sessionPhonograms = shuffle([...phonograms]).slice(0, SESSION_LIMIT);
            
            // 3. Load first card
            updateCard(); 
        });

        // --- HIGH SCORE LOGIC ---
        function checkHighScore(finalScore, totalCards) {
            const currentPercent = Math.round((finalScore / totalCards) * 100);
            
            if (currentPercent > highScore) {
                highScore = currentPercent;
                localStorage.setItem('phonoHighScore', highScore);
                document.getElementById('high-score-display').innerText = `🏆 Best: ${highScore}%`;
                return true; 
            }
            return false;
        }

        // --- PROGRESS BAR LOGIC ---
        function updateProgressBar() {
            const progressBar = document.getElementById('progress-bar');
            // Calculate percentage based on how many cards we've PROCESSED (finished)
            const progress = (cardsProcessed / sessionPhonograms.length) * 100;
            progressBar.style.width = `${progress}%`;
        }
       
        // --- UPDATE CARD DISPLAY ---
        function updateCard() {
            const current = sessionPhonograms[currentIndex];
            
            updateProgressBar();
            
            cardLetters.innerText = current.letters;
            cardLetters.style.display = 'block';
            cardLoader.style.display = 'none';
            const msg = current.type === "rule" ? "Say the sound and the rule!" : "Say the sound!";
            statusMsg.innerText = msg;
            statusMsg.className = "mt-4 text-gray-500 font-medium uppercase tracking-widest text-sm text-center px-4";
        }

        // --- RECORDING BUTTON LOGIC ---
        mainBtn.addEventListener('click', async () => {
            if (isCoolingDown) return;
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                    });

                    const options = { mimeType: 'audio/webm;codecs=opus' };
                    mediaRecorder = new MediaRecorder(stream, options);
                    
                    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioContext.state === 'suspended') await audioContext.resume();

                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 64; 
                    source = audioContext.createMediaStreamSource(stream);
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);

                        const bar = document.createElement('div');
                        bar.style.width = '10px'; bar.style.height = '4px'; bar.style.backgroundColor = '#9333ea';
                        bar.style.borderRadius = '5px'; bar.style.margin = '0 2px';
                        bar.style.transition = 'height 0.1s ease';
                        container.appendChild(bar);
                        barElements.push(bar);
                    }

                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        cancelAnimationFrame(animationId);
                        barElements.forEach(b => b.style.height = '4px');
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });
                        processAudio(audioBlob);
                    };

                    mediaRecorder.start(100);
                    function animate() {
                        if (mediaRecorder && mediaRecorder.state === "recording") {
                            analyser.getByteFrequencyData(dataArray);
                            for (let i = 0; i < barElements.length; i++) {
                                const val = dataArray[i * 2] || 0; 
                                const h = (val / 255) * 60; 
                                barElements[i].style.height = Math.max(4, h) + "px";
                            }
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                    animate();

                    mainBtn.innerText = "STOP";
                    mainBtn.classList.replace('bg-purple-600', 'bg-red-500');
                    statusMsg.innerText = "Listening...";
                } catch (err) {
                    statusMsg.innerText = "Check mic permissions!";
                }
            } else {
                mediaRecorder.stop();
                isCoolingDown = true;
                mainBtn.innerText = "PROCESSING...";
                mainBtn.classList.replace('bg-red-500', 'bg-gray-400');
            }
        });

        // --- SEND AUDIO TO AI ---
        async function processAudio(blob) {
            cardLetters.style.display = 'none';
            cardLoader.style.display = 'block';
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async () => {
                const base64Audio = reader.result.split(',')[1];
                const payload = {
                    phonogram: sessionPhonograms[currentIndex].letters,
                    type: sessionPhonograms[currentIndex].type,
                    target: sessionPhonograms[currentIndex].target,
                    audio: base64Audio
                };

                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                        body: JSON.stringify(payload)
                    });

                    const rawResult = await response.text();
                    const json = JSON.parse(rawResult);
                    const aiText = json.candidates[0].content.parts[0].text;
                    const upperResponse = aiText.toUpperCase().trim();
                    const isCorrect = upperResponse.startsWith("YES");

                    document.getElementById('debug-log').innerText = "AI THOUGHT: " + aiText;
                    handleVerdict(isCorrect);
                } catch (e) {
                    statusMsg.innerText = "Connection Error";
                    resetButton();
                }
            };
        }

        // --- HANDLE RESULT ---
        function handleVerdict(isCorrect) {
            cardLoader.style.display = 'none';
            cardLetters.style.display = 'block';
            
            if (isCorrect) {
                statusMsg.innerText = "YES! YOU ARE CORRECT!";
                statusMsg.className = "mt-4 text-green-600 font-bold uppercase tracking-widest text-sm text-center px-4";
                
                if (attempts === 0) {
                    score++; // POINT EARNED!
                    playSuccessChord();
                } else {
                    playDing(); // Correct, but no point
                }
                
                addSticker();
                attempts = 0; 
                setTimeout(moveToNextCard, 2000);
            } else {
                // FAILURE LOGIC
                attempts++;
                statusMsg.className = "mt-4 text-red-500 font-bold uppercase tracking-widest text-sm text-center px-4";
                
                if (attempts === 1) {
                    statusMsg.innerText = "Try one more time!";
                    setTimeout(() => { resetButton(); }, 2000);
                } else if (attempts === 2) {
                    statusMsg.innerText = "Listen and try one last time!";
                    const audioPlayer = document.getElementById('teacher-audio');
                    audioPlayer.src = sessionPhonograms[currentIndex].audioSrc;
                    audioPlayer.play();
                    setTimeout(() => { resetButton(); }, 4000);
                } else {
                    statusMsg.innerText = "Let's move to the next one.";
                    attempts = 0; 
                    setTimeout(moveToNextCard, 3000);
                }
            }
        }

        // --- NAVIGATION & END GAME ---
        function moveToNextCard() {
            cardsProcessed++;
            
            // Check if session is done
            if (cardsProcessed >= sessionPhonograms.length) {
                showFinalResults();
            } else {
                currentIndex++; // Move to the next random card
                updateCard();
                resetButton();
            }
        }

        function showFinalResults() {
            // Fill progress bar to 100% and turn green
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = '100%';
            progressBar.classList.replace('bg-purple-600', 'bg-green-500');

            const percent = Math.round((score / sessionPhonograms.length) * 100);
            const isNewRecord = checkHighScore(score, sessionPhonograms.length);

            let message = `Great job! You got ${percent}% correct on the first try.`;
            let title = "Session Complete!";
            let titleColor = "text-gray-800";

            if (isNewRecord) {
                title = "🎉 NEW HIGH SCORE! 🎉";
                titleColor = "text-yellow-600";
                message = `AMAZING! You beat your old record! You got ${percent}%!`;
                playSuccessChord(); // Play the happy chord again!
            }

            cardLetters.innerHTML = `
                <div class='text-3xl font-bold ${titleColor}'>${title}</div>
                <div class='text-6xl mt-6 font-bold text-purple-600'>${score}/${sessionPhonograms.length}</div>
            `;
            
            statusMsg.innerText = message;
            statusMsg.className = "mt-6 text-purple-600 font-bold text-lg text-center px-4";
            
            mainBtn.innerText = "START NEW SESSION";
            mainBtn.classList.replace('bg-gray-400', 'bg-purple-600');
            mainBtn.onclick = () => location.reload();
        }

        function resetButton() {
            isCoolingDown = false;
            mainBtn.innerText = "PUSH TO SPEAK";
            mainBtn.className = "bg-purple-600 hover:bg-purple-700 text-white text-xl font-bold py-6 px-12 rounded-2xl shadow-lg transform transition active:scale-95";
        }

        // --- AUDIO SOUNDS ---
        function playDing() {
            if (!audioContext) return;
            const ctx = audioContext;
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.value = 880;
            g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
            osc.start(); osc.stop(ctx.currentTime + 0.5);
        }

        function playSuccessChord() {
            if (!audioContext) return;
            const ctx = audioContext;
            const now = ctx.currentTime;
            [523.25, 659.25, 783.99].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + (i * 0.05));
                gain.gain.setValueAtTime(0.1, now + (i * 0.05));
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5 + (i * 0.05));
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + (i * 0.05));
                osc.stop(now + 0.6 + (i * 0.05));
            });
        }

        function addSticker() {
            stickers++;
            document.getElementById('sticker-count').innerText = `⭐ ${stickers}`;
            const s = document.createElement('div');
            s.className = "text-3xl sticker";
            s.innerText = "🍦"; 
            document.getElementById('sticker-shelf').appendChild(s);
        }
    </script>
