<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonogram Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sticker { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .perspective-1000 { perspective: 1000px; }
    </style>
</head>
<body class="bg-blue-50 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold text-purple-800">Phonogram Lab</h1>
        <div id="sticker-count" class="bg-white px-4 py-2 rounded-full shadow-sm font-bold text-purple-600">
            ⭐ 0
        </div>
    </div>

    <div class="relative w-80 h-96 perspective-1000">
        <div id="card" class="w-full h-full bg-white rounded-3xl shadow-xl flex flex-col items-center justify-center p-8 text-center">
            
            <div id="visualizer-container" style="width: 100%; height: 50px; display: flex; align-items: center; justify-content: center; gap: 3px; margin-bottom: 20px;"></div>

            <div id="card-content" class="flex-grow flex items-center justify-center">
                <h2 id="card-letters" class="text-8xl font-bold text-gray-800">...</h2>
                <div id="card-loader" class="hidden">
                    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-purple-600"></div>
                </div>
            </div>

            <p id="status-msg" class="mt-4 text-gray-500 font-medium uppercase tracking-widest text-sm text-center px-4">Initialising...</p>
        </div>
    </div>

    <div class="mt-12 flex flex-col items-center gap-4">
        <button id="main-btn" class="bg-purple-600 hover:bg-purple-700 text-white text-xl font-bold py-6 px-12 rounded-2xl shadow-lg transform transition active:scale-95">
            PUSH TO SPEAK
        </button>
    </div>

    <div id="debug-log" class="mt-8 p-4 bg-gray-800 text-green-400 font-mono text-xs rounded-lg w-full max-w-md overflow-hidden min-h-[50px]">
        DEBUG: Waiting for first recording...
    </div>

    <div id="sticker-shelf" class="mt-12 flex flex-wrap justify-center gap-2 max-w-md"></div>

    <audio id="teacher-audio"></audio>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5TpQcZ_T1rPMaVmXhDyf6FxkLKIC7m1D_El3g_8ym-fMbVCF2M44WvVhFhU6ZoIP0/exec"; 

        const phonograms = [
            { letters: "sh", type: "sound", target: "/sh/" },
            { letters: "qu", type: "rule", target: "kw and the rule: Always write a q with a u" },
            { letters: "ti", type: "rule", target: "/sh/ and the rule: tall /sh/ must be followed by a vowel" },
            { letters: "ir", type: "sound", target: "/er/ for first" }
        ];

        let currentIndex = 0;
        let stickers = 0;
        let attempts = 0;
        let mediaRecorder = null;
        let audioChunks = [];
        let isCoolingDown = false; 
        let animationId;

        // Visualizer Globals
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let source = null;

        const mainBtn = document.getElementById('main-btn');
        const statusMsg = document.getElementById('status-msg');
        const cardLetters = document.getElementById('card-letters');
        const cardLoader = document.getElementById('card-loader');

        window.addEventListener('load', () => { updateCard(); });

        function updateCard() {
            const current = phonograms[currentIndex];
            cardLetters.innerText = current.letters;
            cardLetters.style.display = 'block';
            cardLoader.style.display = 'none';
            
            const msg = current.type === "rule" ? "Say the sound and the rule!" : "Say the sound!";
            statusMsg.innerText = msg;
            statusMsg.className = "mt-4 text-gray-500 font-medium uppercase tracking-widest text-sm text-center px-4";
        }

        mainBtn.addEventListener('click', async () => {
            if (isCoolingDown) return;

            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                    });

                    const options = { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 128000 };
                    mediaRecorder = new MediaRecorder(stream, options);
                    
                    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioContext.state === 'suspended') await audioContext.resume();

                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 64; 
                    source = audioContext.createMediaStreamSource(stream);
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);

                    const container = document.getElementById('visualizer-container');
                    container.innerHTML = '';
                    const barElements = [];
                    for (let i = 0; i < 16; i++) {
                        const bar = document.createElement('div');
                        bar.style.width = '10px'; bar.style.height = '4px'; bar.style.backgroundColor = '#9333ea';
                        bar.style.borderRadius = '5px'; bar.style.margin = '0 2px';
                        container.appendChild(bar);
                        barElements.push(bar);
                    }

                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        cancelAnimationFrame(animationId);
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        if (audioBlob.size < 2000) { 
                            statusMsg.innerText = "Too short! Speak louder.";
                            resetButton();
                            return;
                        }
                        processAudio(audioBlob);
                    };

                    mediaRecorder.start();

                    function animate() {
                        if (mediaRecorder && mediaRecorder.state === "recording") {
                            analyser.getByteFrequencyData(dataArray);
                            for (let i = 0; i < barElements.length; i++) {
                                const val = dataArray[i * 2] || 0; 
                                const h = (val / 255) * 60; 
                                barElements[i].style.height = Math.max(4, h) + "px";
                            }
                            animationId = requestAnimationFrame(animate);
                        }
                    }
                    animate();

                    mainBtn.innerText = "STOP";
                    mainBtn.classList.replace('bg-purple-600', 'bg-red-500');
                    statusMsg.innerText = "Listening...";

                } catch (err) {
                    statusMsg.innerText = "Check mic permissions!";
                }
            } else {
                mediaRecorder.stop();
                isCoolingDown = true;
                mainBtn.innerText = "PROCESSING...";
                mainBtn.classList.replace('bg-red-500', 'bg-gray-400');
            }
        });

        async function processAudio(blob) {
            cardLetters.style.display = 'none';
            cardLoader.style.display = 'block';
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async () => {
                const base64Audio = reader.result.split(',')[1];
                try {
                    const currentPhono = phonograms[currentIndex];
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({ 
                            phonogram: currentPhono.letters, 
                            type: currentPhono.type, 
                            target: currentPhono.target,
                            audio: base64Audio 
                        }),
                        redirect: "follow"
                    });
                    
                    const rawResult = await response.text();
                    const json = JSON.parse(rawResult);
                    const aiText = json.candidates[0].content.parts[0].text;
                    const isCorrect = aiText.toUpperCase().includes("CORRECT");

                    document.getElementById('debug-log').innerText = "AI THOUGHT: " + aiText;
                    handleVerdict(isCorrect);
                } catch (e) {
                    statusMsg.innerText = "Connection Error";
                    resetButton();
                }
            };
        }

        function handleVerdict(isCorrect) {
            cardLoader.style.display = 'none';
            if (isCorrect) {
                statusMsg.innerText = "YES! YOU ARE CORRECT!";
                statusMsg.className = "mt-4 text-green-600 font-bold uppercase tracking-widest text-sm text-center px-4";
                playDing();
                addSticker();
                setTimeout(moveToNextCard, 2000);
            } else {
                attempts++;
                statusMsg.className = "mt-4 text-red-500 font-bold uppercase tracking-widest text-sm text-center px-4";
                if (attempts >= 2) {
                    statusMsg.innerText = "Let's go to the next one.";
                    attempts = 0; 
                    setTimeout(moveToNextCard, 4000);
                } else {
                    statusMsg.innerText = "Try one more time!";
                    setTimeout(() => {
                        updateCard();
                        resetButton();
                    }, 3000);
                }
            }
        }

        function moveToNextCard() {
            currentIndex = (currentIndex + 1) % phonograms.length;
            updateCard();
            resetButton();
        }

        function resetButton() {
            isCoolingDown = false;
            mainBtn.innerText = "PUSH TO SPEAK";
            mainBtn.classList.remove('bg-gray-400', 'bg-red-500');
            mainBtn.classList.add('bg-purple-600');
        }

        function playDing() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.value = 880;
            g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
            osc.start(); osc.stop(ctx.currentTime + 0.5);
        }

        function addSticker() {
            stickers++;
            document.getElementById('sticker-count').innerText = `⭐ ${stickers}`;
            const s = document.createElement('div');
            s.className = "text-3xl sticker";
            s.innerText = "🍦"; 
            document.getElementById('sticker-shelf').appendChild(s);
        }
    </script>
</body>
</html>
